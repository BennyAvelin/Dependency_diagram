name: Check course planner

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and course planning rules
        run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install catalogue importer dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Test catalogue importer without network access
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
